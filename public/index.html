<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <script>
    // Apply a saved light or dark choice before the first paint, so there is no flash.
    try {
      var savedTheme = localStorage.getItem('jumpseat-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) { /* storage blocked: follow the system */ }
  </script>
  <meta name="description" content="Jumpseat: the social and job platform for Roblox aviation. Follow airlines, discover crews, apply once.">
  <title>Jumpseat · Roblox aviation</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M14 30.5 50 16l-9.5 34-8.2-12.4-8.6-5.6z"/></svg>
        </span>
        <span>Jumpseat</span>
      </a>
      <nav id="side-nav" class="side-nav" aria-label="Main"></nav>
      <div id="account" class="sidebar-foot"></div>
    </aside>

    <main id="app" class="main"></main>

    <aside id="rail" class="rail" aria-label="Trending and suggestions"></aside>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
